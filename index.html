<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expenses Chart Component</title>
    <link rel="shortcut icon" href="./images/favicon-32x32.png" type="image/x-icon">
    <link rel="stylesheet" href="./css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
</head>
<body>
    <div class="wrapper">
        <div class="expenses-body">
            <section class="balance-info">
                <div class="info-balance_content">
                    <p class="info-balance_title">My balance</p>
                    <p class="info-balance_number">$921.48</p>
                </div>
                <div class="info-balance_decor">
                    <div class="decor-info_dark decor-info"></div>
                    <div class="decor-info_light decor-info"></div>
                </div>
            </section>
            <section class="balance-card">
                <h1 class="card-balance_title">Spending - Last 7 days</h1>
                <div class="card-balance_line"></div>
                <div class="card-balance_block"></div>
                <div class="card-balance_line card-balance_line__dark"></div>
                <div class="card-balance_total">
                    <h3 class="total-balance-text">Total this month</h3>
                    <div class="total-balance_block">
                        <p class="total-balance_number">$478.33</p>
                        <div class="total-balance_info">
                            <p class="info-balance_percent">+2.4%</p>
                            <p class="info-balance_text">from last month</p>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </div>

    <script src="./js/script.js"></script>
</body>
</html>
